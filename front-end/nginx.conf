server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        # Essential for React Router: redirects all requests to index.html
        try_files $uri $uri/ /index.html;
    }

      # Explicitly handle Vite's /assets folder
    location /assets/ {
        # Browsers can cache these heavily because Vite hashes the filenames
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Optional: Cache static assets like JS and CSS
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

     # ---------- API PROXIES ----------

    location /api/content/ {
        proxy_pass http://content-api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/auth/ {
        proxy_pass http://auth-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/chat/ {
        proxy_pass http://chat-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- WEBSOCKETS ----------
    location /ws/ {
        proxy_pass http://chat-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
