name: Frontend Docker Build

on:
  push:
    branches:
      - "**"

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-client-app/package-lock.json

      - name: Install deps
        working-directory: react-client-app
        run: npm ci

      - name: Build frontend
        working-directory: react-client-app
        run: npm run build

      - name: Build Docker image
        run: docker build -t cms-frontend -f docker/Dockerfile .
