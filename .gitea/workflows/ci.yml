name: Frontend Docker Build

on:
  push:
    branches:
      - "**"

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check start directory
        run: pwd && ls


      - name: Install deps
        run:  cd front-end/react-client-app && npm i

      - name: Build frontend
        run: cd front-end/react-client-app && npm run build

      - name: Build Docker image
        run: cd front-end && docker build -t cms-frontend:latest .

      # - name: Stop old container
      #   run: docker stop cms-frontend || true && docker rm cms-frontend || true

      - name: Run the docker image
        run: docker run -d -p 8080:80 --name cms-frontend cms-frontend

      - name: Clean unused containers
        run: docker container prune -f

      # - name: Clean unused images
      #   run: docker image prune -af